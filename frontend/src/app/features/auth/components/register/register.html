<section class="signin">
  <p class="eyebrow">Music Library</p>
  <h1>Create an account</h1>
  <p class="lede">
    Self-registration creates a listener account: browse, search, and play. Adding music is done
    from an admin account, provisioned separately.
  </p>

  <form (submit)="submit($event)" novalidate>
    <div class="row">
      <div class="field">
        <label for="reg-first-name">First name</label>
        <input
          id="reg-first-name"
          name="firstName"
          type="text"
          autocomplete="given-name"
          maxlength="100"
          required
          [value]="firstName()"
          (input)="onFirstName($event)"
        />
      </div>
      <div class="field">
        <label for="reg-last-name">Last name</label>
        <input
          id="reg-last-name"
          name="lastName"
          type="text"
          autocomplete="family-name"
          maxlength="100"
          required
          [value]="lastName()"
          (input)="onLastName($event)"
        />
      </div>
    </div>

    <label for="reg-dob">Date of birth</label>
    <input
      id="reg-dob"
      name="dateOfBirth"
      type="date"
      autocomplete="bday"
      required
      [value]="dateOfBirth()"
      (input)="onDateOfBirth($event)"
    />

    <label for="reg-address">Address</label>
    <input
      id="reg-address"
      name="address"
      type="text"
      autocomplete="street-address"
      maxlength="500"
      required
      [value]="address()"
      (input)="onAddress($event)"
    />

    <label for="reg-username">Username</label>
    <input
      id="reg-username"
      name="username"
      type="text"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      minlength="3"
      maxlength="254"
      required
      [value]="username()"
      (input)="onUsername($event)"
    />

    <label for="reg-password">Password</label>
    <input
      id="reg-password"
      name="password"
      type="password"
      autocomplete="new-password"
      minlength="6"
      required
      [value]="password()"
      (input)="onPassword($event)"
    />

    <label for="reg-confirm">Confirm password</label>
    <input
      id="reg-confirm"
      name="confirm"
      type="password"
      autocomplete="new-password"
      minlength="6"
      required
      [value]="confirm()"
      (input)="onConfirm($event)"
    />

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button
      type="submit"
      class="cta"
      [disabled]="
        submitting() ||
        !firstName() ||
        !lastName() ||
        !dateOfBirth() ||
        !address() ||
        !username() ||
        !password() ||
        !confirm()
      "
    >
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>

  <p class="switch">
    Already have an account?
    <button type="button" class="link-button" (click)="backToSignIn.emit()">Sign in</button>
  </p>
</section>
